<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTV Command Pattern Library</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/elements.css" />
    <link rel="stylesheet" href="css/visualizations.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="row align-items-center">
      <div class="ctv-logo-container d-flex col-3 justify-content-center">
        <img
          src="./assets/logos/CTV.png"
          alt="CTV Command logo"
          class="ctv-logo"
        />
      </div>
      <div class="col-6 d-flex justify-content-center text-center text-wrap">
        <h1 class="p-0">CTV Command Pattern Library</h1>
      </div>
    </header>
    <main class="container m-auto mt-3 p-2">
      <div class="row">
        <div class="left-panel col-3">
          <nav>
            <div class="nav-group">
              <ul class="navbar-nav">
                <li><h5>General</h5></li>
                <li class="nav-item">
                  <button id="nav-colours" class="nav-link nav-btn active">
                    Colours
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-typography" class="nav-link nav-btn">
                    Typography
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-styling-layout" class="nav-link nav-btn">
                    Styling & Layout
                  </button>
                </li>
              </ul>
            </div>
            <div class="nav-group">
              <ul class="navbar-nav">
                <li><h5>Elements</h5></li>
                <li class="nav-item">
                  <button id="nav-buttons" class="nav-link nav-btn">
                    Buttons
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-form-inputs" class="nav-link nav-btn">
                    Form Inputs
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-tables" class="nav-link nav-btn">
                    Tables
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-icons" class="nav-link nav-btn">Icons</button>
                </li>
                <li class="nav-item">
                  <button id="nav-navigation-bar" class="nav-link nav-btn">
                    Navigation Bar
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-data-brush" class="nav-link nav-btn">
                    Data Brushing
                  </button>
                </li>
              </ul>
            </div>
            <div class="nav-group">
              <ul class="navbar-nav">
                <li><h5>Data Visualizations</h5></li>
                <li class="nav-item">
                  <button id="nav-line-graphs" class="nav-link nav-btn">
                    Line Graphs
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-bar-graphs" class="nav-link nav-btn">
                    Bar Graphs
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-single-value-charts" class="nav-link nav-btn">
                    Single Value Charts
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-area-charts" class="nav-link nav-btn">
                    Area Charts
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-scatter-plots" class="nav-link nav-btn">
                    Scatter Plots
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-pie-charts" class="nav-link nav-btn">
                    Pie Charts
                  </button>
                </li>
                <li class="nav-item">
                  <button id="nav-donut-charts" class="nav-link nav-btn">
                    Donut Charts
                  </button>
                </li>
              </ul>
            </div>
          </nav>
        </div>
        <div class="right-panel col-9" id="content">
          <!-- Menu content is loaded by js/navigation.js. -->
        </div>
      </div>
    </main>
    <footer></footer>

    <script src="js/navigation.js"></script>
  </body>
</html>
